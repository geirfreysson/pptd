<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
  <title>Toast</title>
  <!-- A transparent WebContentsView over the top of the window (the deck is a native view, so
       an element in index.html can't float over it). main sizes the view to the card. -->
  <style>
    :root {
      --card: #303238; --card-line: rgba(255,255,255,.12); --hi: rgba(255,255,255,.06);
      --text: #eceef1; --muted: #9a9da6; --accent: #2cc2be; --accent-soft: rgba(20,161,158,.2);
      --err: #ff6b70; --err-soft: rgba(229,72,77,.2); --btn-hover: rgba(255,255,255,.08);
      --shadow: 0 14px 34px -10px rgba(0,0,0,.6), 0 3px 10px -2px rgba(0,0,0,.35);
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --card: #ffffff; --card-line: rgba(15,20,30,.09); --hi: rgba(255,255,255,0);
        --text: #1d1f23; --muted: #6a6d75; --accent: #0e8c89; --accent-soft: rgba(20,161,158,.13);
        --err: #c92a31; --err-soft: rgba(229,72,77,.12); --btn-hover: rgba(15,20,30,.06);
        --shadow: 0 14px 34px -12px rgba(20,25,40,.28), 0 3px 10px -3px rgba(20,25,40,.14);
        color-scheme: light;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    /* The margin leaves room for the shadow inside the view. */
    body { display: flex; justify-content: center; padding: 14px 28px 34px; width: max-content; }

    .card { position: relative; display: flex; align-items: center; gap: 11px; min-width: 240px; max-width: 520px;
      padding: 10px 10px 10px 12px; border-radius: 13px; background: var(--card); color: var(--text);
      border: 1px solid var(--card-line); box-shadow: inset 0 1px 0 var(--hi), var(--shadow); overflow: hidden;
      opacity: 0; transform: translateY(-12px) scale(.96); }
    .card.in { animation: in .42s cubic-bezier(.2,1.1,.3,1) forwards; }
    .card.out { animation: out .2s cubic-bezier(.4,0,1,1) forwards; }
    .card.bump { animation: bump .3s cubic-bezier(.2,1.1,.3,1); opacity: 1; transform: none; }
    @keyframes in { to { opacity: 1; transform: none; } }
    @keyframes out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-8px) scale(.97); } }
    @keyframes bump { 40% { transform: scale(1.025); } }

    .badge { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
      background: var(--accent-soft); color: var(--accent); }
    .badge svg { width: 14px; height: 14px; }
    .error .badge { background: var(--err-soft); color: var(--err); }
    .busy .badge svg { animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .card.in .badge { animation: pop .45s .08s cubic-bezier(.2,1.4,.4,1) both; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } }

    .text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-right: 4px; }
    .msg { font-weight: 500; letter-spacing: -.005em;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .hint { display: flex; align-items: center; gap: 5px; color: var(--accent); font-size: 12px; font-weight: 500; }
    .hint[hidden] { display: none; }
    .hint svg { flex: 0 0 auto; width: 12px; height: 12px; }

    button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; border-radius: 8px; }
    .undo { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 9px;
      color: var(--accent); font-weight: 600; }
    .undo:hover { background: var(--accent-soft); }
    .undo kbd { font: 500 11px -apple-system, BlinkMacSystemFont, sans-serif; color: var(--muted);
      padding: 1px 5px; border-radius: 4px; border: 1px solid var(--card-line); }
    .undo[hidden] { display: none; }
    .close { flex: 0 0 auto; width: 24px; height: 24px; display: grid; place-items: center; color: var(--muted);
      opacity: .55; transition: opacity .15s, background .15s; }
    .card:hover .close { opacity: 1; }
    .close:hover { background: var(--btn-hover); color: var(--text); }
    .close svg { width: 10px; height: 10px; }
    .sep { flex: 0 0 auto; width: 1px; height: 18px; background: var(--card-line); }
    .sep[hidden] { display: none; }

    /* Time left before it goes: a hairline along the bottom that pauses on hover. */
    .timer { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent);
      opacity: .45; transform-origin: left; transform: scaleX(0); }
    .error .timer { background: var(--err); }
    .busy .timer { display: none; }
    .timer.run { animation: drain var(--life, 5s) linear forwards; }
    .card:hover .timer.run { animation-play-state: paused; }
    @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    @media (prefers-reduced-motion: reduce) {
      .card.in, .card.out, .card.bump, .card.in .badge { animation-duration: .01s; }
    }
  </style>
</head>
<body>
  <div class="card" id="card" role="status" aria-live="polite">
    <span class="badge" id="badge"></span>
    <span class="text"><span class="msg" id="text"></span><span class="hint" id="hint" hidden><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5l2.5 2.5L3 9.5"/><path d="M7.5 10h3.5"/></svg><span id="hintText"></span></span></span>
    <button class="undo" id="undo" hidden>Undo <kbd>⌘Z</kbd></button>
    <span class="sep" id="sep" hidden></span>
    <button class="close" id="close" aria-label="Dismiss">
      <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg>
    </button>
    <span class="timer" id="timer"></span>
  </div>
  <script src="toast.js"></script>
</body>
</html>
