name: Release macOS app

# Push a tag like v0.3.0 (matching package.json) to build a signed, notarized
# Apple Silicon DMG and attach it to a GitHub release. Run it by hand to build
# without releasing (the DMG is kept as a workflow artifact).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and notarize (Apple Silicon)
    runs-on: macos-15
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Check Apple secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          : "${CSC_LINK:?Missing CSC_LINK secret}"
          : "${CSC_KEY_PASSWORD:?Missing CSC_KEY_PASSWORD secret}"
          : "${APPLE_API_KEY_BASE64:?Missing APPLE_API_KEY_BASE64 secret}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID secret}"
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER secret}"

      - name: Import Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/pptd-build.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CSC_LINK" | sed -E 's#^data:[^,]+,##' | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          rm -f "$certificate_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -nE 's/.*"Developer ID Application: ([^"]+)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "No Developer ID Application identity in CSC_LINK" >&2; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign and notarize the app
        run: |
          # electron-builder notarizes with APPLE_API_KEY (the .p8 path), APPLE_API_KEY_ID and APPLE_API_ISSUER.
          export APPLE_API_KEY="$APPLE_API_KEY_PATH"
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          npx electron-builder --mac dmg --arm64 --publish never \
            -c.mac.identity="$SIGNING_IDENTITY" \
            -c.mac.hardenedRuntime=true \
            -c.mac.gatekeeperAssess=false \
            -c.mac.entitlements=build/entitlements.mac.plist \
            -c.mac.entitlementsInherit=build/entitlements.mac.plist \
            -c.mac.notarize=true

      - name: Notarize and staple the DMG
        run: |
          set -euo pipefail
          dmg="$(ls dist/*.dmg | head -1)"
          echo "DMG_PATH=$dmg" >> "$GITHUB_ENV"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"

      - name: Verify signature and Gatekeeper
        run: |
          set -euo pipefail
          app="dist/mac-arm64/PPTD.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$DMG_PATH"

      - name: Keep the DMG as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPTD-macos-arm64
          path: ${{ env.DMG_PATH }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG_PATH" --title "PPTD $GITHUB_REF_NAME" --generate-notes

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/pptd-build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
