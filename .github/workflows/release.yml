name: Release desktop apps

# Push a tag v<version> (matching package.json, with release-draft.md headed
# "# PPTD v<version>") to build macOS (Apple Silicon), Linux (x64) and Windows (x64)
# and publish one GitHub release with all of them. Run it by hand to build all three
# without releasing: each platform's files are kept as workflow artifacts.
#
# macOS is signed and notarized when the Apple secrets below exist, and ad-hoc signed
# (unsigned for Gatekeeper) when they don't. Windows is unsigned.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos-arm64:
    name: Build macOS DMG (Apple Silicon)
    runs-on: macos-15
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node tools/validate-release.mjs "$RELEASE_TAG"

      - name: Install dependencies (and vendor pi, rg, fd)
        run: npm ci

      - name: Checks
        run: |
          set -euo pipefail
          sh tools/sync-skill.sh
          git diff --exit-code -- agent/plugin/skills || { echo "The skill's copies of the spec, checker or deck tool are stale: run npm run sync-skill and commit." >&2; exit 1; }
          for f in main.js preload.js deck-preload.js renderer.js lib/*.js agent/pi/*.js agent/pi/*.mjs tools/*.mjs; do node --check "$f"; done
          cp agent/plugin/skills/pptd-slides/template.html "$RUNNER_TEMP/template.pptd.html"
          node tools/pptd-check.mjs "$RUNNER_TEMP/template.pptd.html"

      - name: Decide on signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ] && [ -n "$APPLE_API_KEY_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            echo "SIGN=1" >> "$GITHUB_ENV"; echo "Apple secrets found: signing and notarizing."
          else
            echo "SIGN=0" >> "$GITHUB_ENV"; echo "::warning::No Apple signing secrets: the macOS app is ad-hoc signed, not notarized."
          fi

      - name: Import Developer ID certificate
        if: env.SIGN == '1'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/pptd-build.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CSC_LINK" | sed -E 's#^data:[^,]+,##' | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          rm -f "$certificate_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -nE 's/.*"Developer ID Application: ([^"]+)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "No Developer ID Application identity in CSC_LINK" >&2; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        if: env.SIGN == '1'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign and notarize the app
        if: env.SIGN == '1'
        run: |
          # electron-builder notarizes with APPLE_API_KEY (the .p8 path), APPLE_API_KEY_ID and APPLE_API_ISSUER.
          export APPLE_API_KEY="$APPLE_API_KEY_PATH"
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          npx electron-builder --mac dmg --arm64 --publish never \
            -c.mac.identity="$SIGNING_IDENTITY" \
            -c.mac.hardenedRuntime=true \
            -c.mac.gatekeeperAssess=false \
            -c.mac.entitlements=build/entitlements.mac.plist \
            -c.mac.entitlementsInherit=build/entitlements.mac.plist \
            -c.mac.notarize=true

      - name: Build the app (ad-hoc signed)
        if: env.SIGN != '1'
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Notarize and staple the DMG
        if: env.SIGN == '1'
        run: |
          set -euo pipefail
          dmg="$(ls dist/*.dmg | head -1)"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"

      - name: Verify the bundle
        run: |
          set -euo pipefail
          app="dist/mac-arm64/PPTD.app"
          node tools/verify-release-bundle.mjs "$app/Contents/Resources"
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$SIGN" = "1" ]; then
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
            xcrun stapler validate "$(ls dist/*.dmg | head -1)"
          fi

      - name: Stage macOS release assets
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-assets
          dmg="$(ls dist/*.dmg | head -1)"
          cp "$dmg" "release-assets/PPTD-${version}-mac-arm64.dmg"
          cp "$dmg" "release-assets/PPTD-mac-arm64.dmg"
          cd release-assets
          for f in *; do shasum -a 256 "$f" > "$f.sha256"; done

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: release-assets/*
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/pptd-build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  release-linux-x64:
    name: Build Linux packages (x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node tools/validate-release.mjs "$RELEASE_TAG"

      - name: Install dependencies (and vendor pi, rg, fd)
        run: npm ci

      - name: Build AppImage and Debian package
        # node-pty has no Linux prebuild; electron-builder compiles it for Electron here.
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Verify the bundle
        run: node tools/verify-release-bundle.mjs dist/linux-unpacked/resources

      - name: Stage Linux release assets
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          appimage="$(ls dist/*.AppImage | head -1)"
          deb="$(ls dist/*.deb | head -1)"
          mkdir -p release-assets
          cp "$appimage" "release-assets/PPTD-${version}-linux-x86_64.AppImage"
          cp "$appimage" "release-assets/PPTD-linux-x86_64.AppImage"
          cp "$deb" "release-assets/PPTD-${version}-linux-amd64.deb"
          cp "$deb" "release-assets/PPTD-linux-amd64.deb"
          cd release-assets
          for f in *; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          path: release-assets/*
          if-no-files-found: error

  release-windows-x64:
    name: Build Windows installer (x64, unsigned)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node tools/validate-release.mjs "$RELEASE_TAG"

      - name: Install dependencies (and vendor pi, rg, fd)
        run: npm ci

      - name: Build NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify the bundle
        run: node tools/verify-release-bundle.mjs dist/win-unpacked/resources

      - name: Stage Windows release assets
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Get-ChildItem dist -Filter '*.exe' | Where-Object { $_.Name -notlike '*.blockmap' } | Select-Object -First 1
          if (-not $installer) { throw 'The NSIS installer was not produced.' }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          foreach ($name in @("PPTD-$version-windows-x64-setup.exe", 'PPTD-windows-x64-setup.exe')) {
            Copy-Item $installer.FullName (Join-Path release-assets $name)
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path release-assets $name)).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText((Join-Path release-assets "$name.sha256"), "$hash  $name`n")
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - release-macos-arm64
      - release-linux-x64
      - release-windows-x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download native release assets
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Check every platform is there
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for f in "PPTD-${version}-mac-arm64.dmg" "PPTD-${version}-linux-x86_64.AppImage" \
                   "PPTD-${version}-linux-amd64.deb" "PPTD-${version}-windows-x64-setup.exe"; do
            test -f "release-assets/$f" || { echo "Missing $f" >&2; exit 1; }
            test -f "release-assets/$f.sha256" || { echo "Missing $f.sha256" >&2; exit 1; }
          done
          ls -la release-assets

      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The notes: release-draft.md without its heading (the title says it), then how to install.
          { tail -n +2 release-draft.md; echo; cat .github/release-install.md; } > "$RUNNER_TEMP/notes.md"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "PPTD $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release edit "$GITHUB_REF_NAME" --title "PPTD $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
